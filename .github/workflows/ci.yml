name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cbu
          POSTGRES_PASSWORD: cbu_ci_password
          POSTGRES_DB: cbu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://cbu:cbu_ci_password@localhost:5432/cbu_test
      NEXT_PUBLIC_SITE_URL: https://cristianbarbosa.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:setup:test
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
